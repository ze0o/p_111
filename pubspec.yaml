name: car_insurance_app
description: >-
  A Firebase-backed Flutter application for vehicle registration, insurance
  requests, policy management, payments, and accident reporting.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5

  # Notifications & networking
  flutter_local_notifications: ^19.2.0
  http: ^1.4.0

  # UI
  cupertino_icons: ^1.0.8
  animate_do: ^4.2.0
  flutter_staggered_animations: ^1.1.1
  image_picker: ^1.1.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
